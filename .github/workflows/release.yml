name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    uses: ./.github/workflows/build.yml

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: wivrn-macos

      - uses: actions/download-artifact@v4
        with:
          name: WiVRn.app

      # WiVRn.app's self-update takes the release's WiVRn-<version>.zip and compares <version> with the tag.
      # wivrn-macos-<version>-headless.zip is the install tree: server and runtime, no dashboard.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version="$(cat VERSION)"
          [[ "v$version" == "$TAG" ]] || { echo "tag $TAG does not match VERSION $version" >&2; exit 1; }
          mv WiVRn.zip "WiVRn-$version.zip"
          mv wivrn-macos.zip "wivrn-macos-$version-headless.zip"
          notes="docs/releases/$TAG.md"
          if [[ -f "$notes" ]]; then args=(--notes-file "$notes"); else args=(--generate-notes); fi
          gh release create "$TAG" "WiVRn-$version.zip" "wivrn-macos-$version-headless.zip" --verify-tag \
            --title "WiVRn for macOS $version" "${args[@]}"
