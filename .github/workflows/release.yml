name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    uses: ./.github/workflows/build.yml

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: wivrn-macos

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          zip="wivrn-macos-$TAG.zip"
          mv wivrn-macos.zip "$zip"
          notes="docs/releases/$TAG.md"
          if [[ -f "$notes" ]]; then args=(--notes-file "$notes"); else args=(--generate-notes); fi
          gh release create "$TAG" "$zip" --verify-tag --title "wivrn-macos $TAG" "${args[@]}"
